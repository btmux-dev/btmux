name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, README.md, desktop/README.md, CHANGELOG.md, Cargo.toml, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, README.md, desktop/README.md, CHANGELOG.md, Cargo.toml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Fetch demo recordings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/public/demos
          gh release download media --dir docs/public/demos --clobber \
            || echo "::warning::No media release; the site builds without demos"
      - working-directory: docs
        run: bun install --frozen-lockfile && bun run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
